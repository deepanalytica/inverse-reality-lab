name: Validate public surface

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/progressive-disclosure-landing-v3
    paths:
      - "index.html"
      - "architecture-room/**"
      - "assets/portal-v3.css"
      - "assets/portal-v3.js"
      - "assets/portal-three.js"
      - "assets/architecture-room.js"
      - "site-nav.js"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "scripts/validate_public_surface.mjs"
      - ".github/workflows/validate-portal.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check assets/portal-v3.js
          node --check assets/architecture-room.js
          node --check site-nav.js
          node --input-type=module --check < assets/portal-three.js
      - name: Validate public surface
        run: node scripts/validate_public_surface.mjs
