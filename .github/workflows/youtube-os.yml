name: YOUTUBE OS
on:
  push:
    branches: [main]
    paths: ['youtube-os/**', '.github/workflows/youtube-os.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
permissions:
  contents: read
concurrency:
  group: youtube-os-production
  cancel-in-progress: false
jobs:
  production:
    if: github.event_name != 'schedule' || vars.YT_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: youtube-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube client
        if: github.event_name != 'push' && vars.YT_UPLOAD_ENABLED == 'true'
        run: pip install google-api-python-client==2.149.0 google-auth==2.35.0
      - name: Find authorized episodes not yet uploaded
        if: github.event_name != 'push' && vars.YT_UPLOAD_ENABLED == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_APPROVED_IDS: ${{ vars.YT_APPROVED_IDS }}
        run: python upload.py --pending
      - name: Select production queue
        id: queue
        run: |
          if [ -f pending.txt ]; then
            ids="$(cat pending.txt)"
          else
            ids="signal memory city sun eye"
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Install render dependencies
        if: steps.queue.outputs.ids != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation
          npm install --no-audit --no-fund
          pip install piper-tts==1.3.0 numpy==1.26.4
          python -m piper.download_voices es_ES-davefx-medium
      - name: Render and verify
        if: steps.queue.outputs.ids != ''
        env:
          EPISODE_IDS: ${{ steps.queue.outputs.ids }}
        run: python produce.py $EPISODE_IDS
      - name: Upload approved renders to authorized YouTube channel
        if: github.event_name != 'push' && vars.YT_UPLOAD_ENABLED == 'true' && steps.queue.outputs.ids != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_APPROVED_IDS: ${{ vars.YT_APPROVED_IDS }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
        run: python upload.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.queue.outputs.ids != ''
        with:
          name: inverse-reality-${{ github.run_id }}
          path: youtube-os/out/
          retention-days: 14
          if-no-files-found: warn
