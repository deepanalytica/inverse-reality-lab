name: Build paper and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX working paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/main.tex

      - name: Publish compiled PDF inside the site
        shell: bash
        run: |
          PDF_PATH="$(find . -type f -name 'main.pdf' | head -n 1)"
          test -n "$PDF_PATH"
          echo "Compiled paper: $PDF_PATH"
          cp "$PDF_PATH" paper/PAPER.pdf

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static research site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
