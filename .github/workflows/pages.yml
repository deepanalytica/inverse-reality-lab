name: Build paper and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX working paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/main.tex

      - name: Publish compiled PDF inside the site
        shell: bash
        run: |
          PDF_PATH="$(find . -type f -name 'main.pdf' | head -n 1)"
          test -n "$PDF_PATH"
          cp "$PDF_PATH" paper/PAPER.pdf

      - name: Sync compiled PDF back to repository
        shell: bash
        run: |
          if ! git diff --quiet -- paper/PAPER.pdf; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/PAPER.pdf
            git commit -m "Update compiled preprint PDF v1.2 [skip ci]"
            git push
          fi

      - name: Validate public research and product surface
        shell: bash
        run: |
          node --check assets/dashboard.js
          node --check assets/praxios.js
          node --check assets/praxios-api.mjs
          node --check assets/portal-v3.js
          node --check assets/portal-v4.js
          node --check assets/architecture-room.js
          node --input-type=module --check < assets/portal-three.js
          node --check site-nav.js
          node scripts/mineral_inverse_benchmark.mjs
          python -m json.tool data/mineral_benchmarks.json >/dev/null
          python -m json.tool data/mineral_benchmark_results.json >/dev/null
          python -m json.tool data/khufu.json >/dev/null
          node scripts/validate_data.mjs
          node scripts/validate_public_surface.mjs
          node scripts/validate_book.mjs
          python scripts/topology_synthetic.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static research site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
