<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080b">
<title>PRAXIOS Web OS — Investor Demo</title>
<style>
:root{--bg:#07080b;--panel:#0e1218;--panel2:#0a0d12;--line:rgba(244,248,255,.1);--line2:rgba(244,248,255,.17);--text:#f4f7fb;--muted:#919ba7;--faint:#5c6672;--cyan:#67e8f9;--lime:#a3e635;--blue:#60a5fa;--amber:#fbbf24;--orange:#fb923c;--red:#fb7185}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 8%,rgba(35,117,130,.14),transparent 34rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.grid{position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent 82%)}
.top{position:sticky;top:0;z-index:40;height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(7,8,11,.84);backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.brand .mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(103,232,249,.35);color:var(--cyan);font:700 10px ui-monospace,monospace}.brand strong,.brand small{display:block}.brand strong{font-size:12px;letter-spacing:.08em}.brand small{margin-top:2px;color:var(--muted);font:600 7px ui-monospace,monospace;letter-spacing:.1em}.runtime{display:flex;gap:8px;align-items:center;color:#99a3ae;font:600 8px ui-monospace,monospace}.runtime i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px rgba(163,230,53,.4)}.top a.back{justify-self:end;color:#aab3bd;text-decoration:none;font:700 8px ui-monospace,monospace;border:1px solid var(--line);padding:9px 11px}
.shell{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 60px)}.side{position:sticky;top:60px;height:calc(100vh - 60px);display:flex;flex-direction:column;padding:16px 9px 12px;border-right:1px solid var(--line);background:rgba(9,11,15,.7)}.side>span{padding:0 8px 9px;color:#59636f;font:700 7px ui-monospace,monospace;letter-spacing:.13em}.nav{display:grid;gap:3px}.nav button{width:100%;min-height:38px;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:7px;padding:0 9px;border:0;background:none;color:#7f8995;text-align:left;cursor:pointer}.nav button span{font:700 7px ui-monospace,monospace;color:#56606c}.nav button strong{font-size:10px}.nav button.active{color:#fff;background:rgba(103,232,249,.07);box-shadow:inset 2px 0 0 var(--cyan)}.nav button.active span{color:var(--cyan)}.authority{margin-top:auto;padding:13px 9px;border-top:1px solid var(--line)}.authority span,.authority strong,.authority small{display:block}.authority span{color:#59636f;font:700 7px ui-monospace,monospace}.authority strong{margin-top:5px;color:var(--lime);font:700 10px ui-monospace,monospace}.authority small{margin-top:3px;color:#59636f;font-size:8px}
.work{padding:36px clamp(18px,4vw,54px) 80px;min-width:0}.kicker{color:var(--cyan);font:700 8px ui-monospace,monospace;letter-spacing:.13em}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.head h1{margin:7px 0 7px;font-size:clamp(34px,4vw,56px);line-height:1;letter-spacing:-.045em}.head p{max-width:680px;margin:0;color:var(--muted);font-size:11px;line-height:1.6}.btn{min-height:37px;padding:0 13px;border:1px solid var(--line2);background:rgba(255,255,255,.025);color:#e3e8ee;font:700 8px ui-monospace,monospace;cursor:pointer}.btn.primary{border-color:var(--cyan);background:var(--cyan);color:#061014}.btn.danger{border-color:rgba(251,113,133,.35);color:var(--red);background:rgba(251,113,133,.05)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.metric{padding:17px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric span{display:block;color:#65707c;font:700 7px ui-monospace,monospace}.metric strong{display:block;margin:10px 0 5px;font-size:29px}.metric small{color:#747e8a;font-size:8px}
.card{border:1px solid var(--line);background:rgba(14,18,24,.76)}.ptitle{display:flex;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line);color:#74808c;font:700 7px ui-monospace,monospace}.ptitle b{color:#5d6773}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.loop{display:grid;grid-template-columns:repeat(4,1fr);padding:14px}.phase{min-height:70px;padding:9px;border:1px solid var(--line);border-right:0}.phase:nth-child(4n){border-right:1px solid var(--line)}.phase span{display:block;color:#4f5965;font:600 7px ui-monospace,monospace}.phase strong{display:block;margin-top:22px;font:700 8px ui-monospace,monospace}.phase.active{background:rgba(103,232,249,.06);border-color:rgba(103,232,249,.2);box-shadow:inset 0 -2px 0 var(--cyan)}.debt{padding:20px}.debt span{color:var(--amber);font:700 7px ui-monospace,monospace}.debt p{color:#929ca8;font-size:10px;line-height:1.55}.debt button{border:0;background:none;color:var(--cyan);font:700 8px ui-monospace,monospace;cursor:pointer}
.form{padding:16px}.form label{display:grid;gap:6px;margin-top:12px;color:#77828e;font:700 7px ui-monospace,monospace}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);outline:none;background:#0a0e13;color:#fff;padding:10px;font:500 10px Inter,sans-serif}.form textarea{min-height:84px;resize:vertical}.form .btn{margin-top:14px}.list .row{padding:13px;border-bottom:1px solid var(--line)}.row>div:first-child{display:flex;justify-content:space-between;gap:10px}.row span{color:var(--cyan);font:700 7px ui-monospace,monospace}.row strong{font-size:10px}.row p{margin:7px 0;color:#8d97a3;font-size:9px;line-height:1.5}.row small{color:#606a76;font-size:8px}.tag{font:800 7px ui-monospace,monospace}.pass{color:var(--lime)!important}.review{color:var(--orange)!important}.block{color:var(--red)!important}.neutral{color:#818b97!important}
.claimLayout{display:grid;grid-template-columns:330px 1fr;border:1px solid var(--line);background:#0c0f14}.claimNav{border-right:1px solid var(--line)}.claimBtn{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border:0;border-bottom:1px solid rgba(255,255,255,.04);background:none;color:#909aa6;text-align:left;cursor:pointer}.claimBtn.active{background:rgba(103,232,249,.05);box-shadow:inset 2px 0 0 var(--cyan)}.claimBtn b{font:700 7px ui-monospace,monospace;color:#dbe1e8}.claimBtn p{margin:5px 0 0;font-size:9px;line-height:1.4}.claimBtn span{font:800 7px ui-monospace,monospace}.inspect{padding:18px}.inspect h3{font-size:20px;line-height:1.4;margin:12px 0}.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.gate{padding:11px;border:1px solid var(--line)}.gate span{font:800 7px ui-monospace,monospace}.gate strong{display:block;margin:7px 0 4px;font:700 8px ui-monospace,monospace}.gate p{margin:0;color:#74808c;font-size:8px;line-height:1.4}
.bucketgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bucket{min-height:220px;border:1px solid var(--line)}.bucket .row{padding:10px 12px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}.option{min-height:110px;padding:12px;border:1px solid var(--line);background:#0a0e13;color:#9aa4af;text-align:left;cursor:pointer}.option strong{display:block;color:#e3e8ee;font-size:10px}.option p{font-size:8px;line-height:1.45}.auth{padding:14px;border-bottom:1px solid var(--line)}.auth>div{display:grid;grid-template-columns:1fr auto;gap:8px}.auth p{color:#858f9a;font-size:9px}.auth .buttons{display:flex;gap:7px;margin-top:10px}
.event{display:grid;grid-template-columns:45px 1.1fr .8fr 150px;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:8px}.event span{color:var(--cyan);font-family:ui-monospace,monospace}.event b{font-family:ui-monospace,monospace}.event em,.event time{color:#606a76;font-style:normal}.arch{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line)}.arch aside{padding:7px;border-right:1px solid var(--line)}.arch button{width:100%;padding:11px;border:0;border-bottom:1px solid rgba(255,255,255,.04);background:none;color:#7d8793;text-align:left;cursor:pointer}.arch button.active{background:rgba(103,232,249,.05);box-shadow:inset 2px 0 0 var(--cyan);color:#fff}.arch article{min-height:430px;display:grid;align-content:center;padding:50px}.arch article span{color:var(--cyan);font:700 7px ui-monospace,monospace}.arch article h2{margin:11px 0 13px;font-size:46px;letter-spacing:-.04em}.arch article p{max-width:650px;color:#97a1ad;font-size:11px;line-height:1.65}.empty{min-height:350px;display:grid;align-content:center;padding:45px;border:1px solid var(--line)}.empty span{color:var(--cyan);font:700 8px ui-monospace,monospace}.empty h2{margin:12px 0 9px;font-size:40px}.empty p{max-width:560px;color:#909aa6;font-size:11px;line-height:1.6}.notice{margin-bottom:14px;padding:11px 13px;border:1px solid rgba(103,232,249,.18);background:rgba(103,232,249,.05);color:#9ea8b3;font-size:9px}.notice b{color:var(--cyan);margin-right:8px}.warning{border-color:rgba(251,191,36,.2);background:rgba(251,191,36,.045)}.warning b{color:var(--amber)}
@media(max-width:1000px){.metrics{grid-template-columns:1fr 1fr}.grid2,.claimLayout,.arch{grid-template-columns:1fr}.claimNav,.arch aside{border-right:0;border-bottom:1px solid var(--line)}.gates,.options{grid-template-columns:1fr 1fr}.bucketgrid{grid-template-columns:1fr}.arch article{min-height:330px;padding:32px}}
@media(max-width:700px){.top{grid-template-columns:1fr auto}.runtime{display:none}.shell{display:block}.side{position:fixed;z-index:35;left:0;right:0;bottom:0;top:auto;height:58px;display:block;padding:4px;border-right:0;border-top:1px solid var(--line);background:rgba(7,8,11,.94)}.side>span,.authority{display:none}.nav{display:flex;overflow-x:auto}.nav button{min-width:62px;height:48px;grid-template-columns:1fr;justify-items:center}.nav button strong{display:none}.work{padding:26px 16px 85px}.head{align-items:start;flex-direction:column}.metrics,.gates,.options{grid-template-columns:1fr}.loop{grid-template-columns:1fr 1fr}.event{grid-template-columns:40px 1fr}.event em,.event time{grid-column:2}.arch article h2{font-size:36px}}
</style>
<script defer src="../../site-nav.js"></script>\n</head>
<body>
<div class="grid"></div>
<header class="top">
  <a class="brand" href="./"><span class="mark">PX</span><span><strong>PRAXIOS WEB OS</strong><small>INVESTOR DEMO · LOCAL FIXTURE</small></span></a>
  <div class="runtime"><i></i>LOCAL FIXTURE · NO MODEL CALLS</div>
  <a class="back" href="../praxios-universe/">← Investor overview</a>
</header>
<div class="shell">
<aside class="side"><span>SYSTEM</span><nav class="nav" id="nav"></nav><div class="authority"><span>FINAL AUTHORITY</span><strong>HUMAN</strong><small>Decision ≠ authorization</small></div></aside>
<main class="work" id="work"></main>
</div>
<script>
const KEY="praxios.webos.publicdemo.v1";
const views=[["overview","OV","Overview"],["mission","MI","Mission"],["evidence","EV","Evidence"],["claims","CL","Claims"],["decision","DR","Decision Room"],["actions","AC","Actions"],["ledger","LG","Ledger"],["architecture","AR","Architecture"]];
const arch=[
["EL PUENTE","Epistemic doctrine","Imagination is allowed to explore. Authority is earned through evidence, instruments, refutation and explicit epistemic state."],
["Mathematical Harness","Formal layer","Epistemic states, promotion rules and transfer constraints are explicit enough to inspect and compute."],
["The Shark","Adversarial operator","An operator with no incentive to help a conclusion survive. It attacks provenance, alternatives, instruments and debt."],
["Meta-Harness","Assurance plane","The policy decision point between model output and accepted claims or executable actions."],
["PRAXIOS OS","Execution plane","Owns canonical state, missions, tasks, tools, authorizations, decisions, actions and outcomes outside the LLM."],
["Decision Room","Human authority","Projects findings, unknowns, exclusions and options without turning a UI selection into executor authority."],
["Inverse Reality Lab","Research domain","Uses observed terminal states and constraints to reduce compatible histories while preserving non-identifiability."]
];
let view="overview", selectedClaim=0, selectedArch=3;
function uid(p){return p+"-"+crypto.randomUUID().slice(0,8).toUpperCase()}
function now(){return new Date().toISOString()}
function base(){return{session:null}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")||base()}catch{return base()}}
let store=load();
function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function event(type,payload={}){const s=store.session;if(!s)return;s.ledger.push({seq:s.ledger.length+1,time:now(),type,actor:"fixture",payload});s.rev=s.ledger.length;s.updated=now();save()}
function newSession(goal){store.session={id:uid("session"),goal,status:"RUNNING",phase:"OBSERVE",rev:0,created:now(),updated:now(),evidence:[],claims:[],auth:[],actions:[],decisions:[{id:uid("D"),status:"OPEN",options:[["more","Acquire more evidence"],["hold","Hold"],["bounded","Prepare bounded output"]]}],ledger:[],artifacts:[]};event("SESSION_STARTED",{goal});save();render()}
function addEvidence(d){const s=store.session,e={id:uid("E"),kind:d.kind,summary:d.summary,source:d.source,uncertainty:d.uncertainty};s.evidence.push(e);event("EVIDENCE_REGISTERED",{evidenceId:e.id});render()}
function evalClaim(c){const ev=store.session.evidence.filter(e=>c.evidence.includes(e.id));const outside=ev.some(e=>!["synthetic","user_input"].includes(e.kind));const gates=[
["EPISTEMIC_CLASS",c.epistemic==="UNKNOWN"?"BLOCK":["HYPOTHESIS","COUNTERFACTUAL"].includes(c.epistemic)?"REVIEW":"PASS"],
["EVIDENCE",ev.length?"PASS":"BLOCK"],["PROVENANCE",ev.length&&ev.every(e=>e.source)?"PASS":ev.length?"REVIEW":"BLOCK"],["UNCERTAINTY",c.uncertainty?"PASS":"REVIEW"],["ROLE_SEPARATION",c.reviewed?"PASS":"REVIEW"],["OUTSIDE",outside?"PASS":ev.length?"REVIEW":"BLOCK"]];
c.gates=gates.map(g=>({id:g[0],status:g[1]}));c.verdict=c.gates.some(g=>g.status==="BLOCK")?"BLOCK":c.gates.some(g=>g.status==="REVIEW")?"REVIEW":"PASS";c.status="EVALUATED";event("CLAIM_EVALUATED",{claimId:c.id,verdict:c.verdict,gates:c.gates})}
function addClaim(d){const s=store.session,c={id:uid("C"),text:d.text,epistemic:d.epistemic,evidence:d.evidence,uncertainty:d.uncertainty,reviewed:false,status:"PROPOSED",verdict:null,gates:[]};s.claims.push(c);s.phase="PROPOSE";event("CLAIM_PROPOSED",{claimId:c.id});selectedClaim=s.claims.length-1;render()}
function review(c){c.reviewed=true;event("CLAIM_REVIEW_RECORDED",{claimId:c.id});evalClaim(c);store.session.phase="VERIFY";save();render()}
function requestAction(){const s=store.session;const pass=s.claims.filter(c=>c.verdict==="PASS").map(c=>c.id);const a={id:uid("A"),title:"Create bounded measurement-design artifact",executor:"measurement-design",effect:"write",required:pass,status:"PROPOSED"};const auth={id:uid("AUTH"),actionId:a.id,status:"PENDING",consumed:false};s.actions.push(a);s.auth.push(auth);s.phase="AUTHORIZE";event("AUTHORIZATION_REQUESTED",{authorizationId:auth.id,actionId:a.id});render()}
function decideAuth(a,ok){a.status=ok?"APPROVED":"DENIED";event(ok?"AUTHORIZATION_APPROVED":"AUTHORIZATION_DENIED",{authorizationId:a.id});render()}
function execute(a){const s=store.session,auth=s.auth.find(x=>x.actionId===a.id);if(!auth||auth.status!=="APPROVED"||auth.consumed)return alert("Approved unused authorization required.");auth.consumed=true;a.status="EXECUTED";s.phase="EXECUTE";s.artifacts.push({id:uid("artifact"),type:a.executor});event("ACTION_EXECUTED",{actionId:a.id});s.phase="OBSERVE";event("PHASE_CHANGED",{to:"OBSERVE"});render()}
function decision(d,opt){d.status="SELECTED";d.selected=opt;event("DECISION_SELECTED",{decisionId:d.id,optionId:opt});render()}
function tone(x){return x==="PASS"||x==="APPROVED"||x==="EXECUTED"?"pass":x==="BLOCK"||x==="DENIED"?"block":x==="REVIEW"||x==="PENDING"||x==="PROPOSED"?"review":"neutral"}
function nav(){const n=document.getElementById("nav");n.innerHTML="";views.forEach(v=>{const b=document.createElement("button");b.className=v[0]===view?"active":"";b.innerHTML="<span>"+v[1]+"</span><strong>"+v[2]+"</strong>";b.onclick=()=>{view=v[0];render()};n.appendChild(b)})}
function head(k,h,p,action=""){return '<div class="head"><div><div class="kicker">'+k+'</div><h1>'+h+'</h1><p>'+p+'</p></div>'+action+'</div>'}
function empty(){return '<div class="empty"><span>NO CANONICAL SESSION</span><h2>Start with a mission.</h2><p>This public demo stores deterministic fixture state in your own browser. It does not call an LLM or a production PRAXIOS backend.</p><button class="btn primary" id="start">Create demo mission →</button></div>'}
function renderOverview(){
 const s=store.session;if(!s)return head("CONTROL PLANE","Mission overview","Canonical state, assurance and authority in one surface.")+empty();
 const pass=s.claims.filter(c=>c.verdict==="PASS").length,rev=s.claims.filter(c=>c.verdict==="REVIEW").length,blk=s.claims.filter(c=>c.verdict==="BLOCK").length;
 const phases=["OBSERVE","REASON","PROPOSE","VERIFY","AUTHORIZE","EXECUTE","OBSERVE"];
 return head("CONTROL PLANE / LIVE STATE","Mission overview","A working fixture of the PRAXIOS operating surface.")+
 '<div class="notice warning"><b>FIXTURE</b>No provider calls. Synthetic/local state must not be interpreted as scientific validation.</div>'+
 '<div class="metrics"><div class="metric"><span>REVISION</span><strong>'+s.rev+'</strong><small>'+s.status+'</small></div><div class="metric"><span>EVIDENCE</span><strong>'+s.evidence.length+'</strong><small>registered items</small></div><div class="metric"><span>CLAIMS</span><strong>'+s.claims.length+'</strong><small>'+pass+' PASS · '+rev+' REVIEW · '+blk+' BLOCK</small></div><div class="metric"><span>AUTHORIZATIONS</span><strong>'+s.auth.length+'</strong><small>'+s.auth.filter(a=>a.status==="PENDING").length+' pending</small></div></div>'+
 '<div class="grid2"><section class="card"><div class="ptitle"><span>PRAXIOS LOOP</span><b>'+s.phase+'</b></div><div class="loop">'+phases.map((p,i)=>'<div class="phase '+(p===s.phase?"active":"")+'"><span>0'+(i+1)+'</span><strong>'+p+'</strong></div>').join("")+'</div></section><section class="card"><div class="ptitle"><span>OPEN DEBT</span><b>BOOK</b></div><div class="debt"><span>WEAKEST LINK</span><p>'+(s.claims.find(c=>c.verdict!=="PASS")?.text||(!s.evidence.length?"No evidence registered.":"No blocking fixture debt detected."))+'</p><button data-go="claims">Inspect claims →</button></div></section></div>';
}
function renderMission(){
 const s=store.session;
 return head("MISSION CONTROL","Mission","Create a canonical fixture session. The real Web OS uses the remote runtime gateway in its full-stack build.")+
 '<div class="grid2"><section class="card"><div class="ptitle"><span>NEW MISSION</span><b>FIXTURE</b></div><form class="form" id="missionForm"><label>Goal<textarea id="goal">'+(s?.goal||"Assess whether the available evidence supports an operational conclusion and identify the next discriminating measurement.")+'</textarea></label><button class="btn primary">Create session</button></form></section><section class="card"><div class="ptitle"><span>ACTIVE SESSION</span><b>'+(s?s.id:"NONE")+'</b></div>'+(s?'<div class="list"><div class="row"><div><span>STATUS</span><strong>'+s.status+'</strong></div><p>'+s.goal+'</p><small>Phase '+s.phase+' · Revision '+s.rev+'</small></div></div>':'<div class="row"><p>No active session.</p></div>')+'</section></div>';
}
function renderEvidence(){
 const s=store.session;if(!s)return head("THE OUTSIDE","Evidence registry","Register evidence before claims borrow authority from it.")+empty();
 return head("THE OUTSIDE / INSTRUMENTS","Evidence registry","Evidence remains separate from narrative.")+
 '<div class="grid2"><section class="card list"><div class="ptitle"><span>REGISTERED</span><b>'+s.evidence.length+'</b></div>'+ (s.evidence.length?s.evidence.map(e=>'<div class="row"><div><span>'+e.id+'</span><strong>'+e.kind+'</strong></div><p>'+e.summary+'</p><small>'+(e.source||"No source URI")+' · '+(e.uncertainty||"No uncertainty statement")+'</small></div>').join(""):'<div class="row"><p>No evidence registered.</p></div>')+'</section><section class="card"><div class="ptitle"><span>ADD EVIDENCE</span><b>CANONICAL</b></div><form class="form" id="evForm"><label>Kind<select id="evKind"><option>measurement</option><option>publication</option><option>reported</option><option>synthetic</option><option>user_input</option></select></label><label>Summary<textarea id="evSummary"></textarea></label><label>Source URI<input id="evSource" placeholder="https://…"></label><label>Uncertainty<input id="evUncertainty"></label><button class="btn primary">Register evidence</button></form></section></div>';
}
function renderClaims(){
 const s=store.session;if(!s)return head("CLAIM ASSURANCE","Claims","Claims must cross explicit gates.")+empty();
 const c=s.claims[selectedClaim]||s.claims[0];
 return head("CLAIM → REVIEW → GATES","Claim assurance","A result cannot become authoritative simply because it was generated.")+
 '<div class="claimLayout"><aside class="claimNav"><div class="ptitle"><span>CLAIMS</span><b>'+s.claims.length+'</b></div>'+ (s.claims.length?s.claims.map((x,i)=>'<button class="claimBtn '+(i===selectedClaim?"active":"")+'" data-claim="'+i+'"><div><b>'+x.id+'</b><p>'+x.text+'</p></div><span class="'+tone(x.verdict||x.status)+'">'+(x.verdict||x.status)+'</span></button>').join(""):'<div class="row"><p>No claims.</p></div>')+'</aside><section><div class="ptitle"><span>INSPECTOR</span><b>'+(c?.id||"NONE")+'</b></div>'+(c?'<div class="inspect"><span class="tag '+tone(c.verdict||c.status)+'">'+(c.verdict||c.status)+'</span><h3>'+c.text+'</h3><p class="neutral">Epistemic class: '+c.epistemic+' · Evidence: '+(c.evidence.join(", ")||"none")+'</p><div class="gates">'+(c.gates.length?c.gates.map(g=>'<div class="gate"><span class="'+tone(g.status)+'">'+g.status+'</span><strong>'+g.id+'</strong><p>Fixture gate evaluation.</p></div>').join(""):'<div class="notice">Claim has not crossed Meta-Harness gates.</div>')+'</div><button class="btn primary" id="reviewClaim" style="margin-top:14px">Independent review + verify</button></div>':'<div class="row"><p>Select a claim.</p></div>')+'</section></div>'+
 '<section class="card" style="margin-top:12px"><div class="ptitle"><span>PROPOSE CLAIM</span><b>NO AUTO-PROMOTION</b></div><form class="form" id="claimForm"><label>Claim<textarea id="clText"></textarea></label><label>Epistemic class<select id="clClass"><option>HYPOTHESIS</option><option>DERIVED</option><option>INFERRED</option><option>OBSERVED</option><option>UNKNOWN</option></select></label><label>Uncertainty<input id="clUncertainty"></label><label>Evidence links<div id="evChecks">'+s.evidence.map(e=>'<label style="display:block;margin:5px 0"><input type="checkbox" value="'+e.id+'"> '+e.id+' · '+e.summary+'</label>').join("")+'</div></label><button class="btn primary">Admit as PROPOSED</button></form></section>';
}
function renderDecision(){
 const s=store.session;if(!s)return head("HUMAN JUDGMENT","Decision Room","Findings, unknowns and exclusions remain distinct.")+empty();
 const buckets=[["FINDINGS","PASS",s.claims.filter(c=>c.verdict==="PASS")],["UNKNOWNS","REVIEW",s.claims.filter(c=>!c.verdict||c.verdict==="REVIEW")],["EXCLUDED","BLOCK",s.claims.filter(c=>c.verdict==="BLOCK")]];
 return head("HUMAN JUDGMENT","Control & Decision Room","Decision selection is deliberately separate from effectful authorization.")+
 '<div class="bucketgrid">'+buckets.map(b=>'<section class="bucket"><div class="ptitle"><span>'+b[0]+'</span><b class="'+tone(b[1])+'">'+b[1]+'</b></div>'+ (b[2].length?b[2].map(c=>'<div class="row"><div><span>'+c.id+'</span></div><p>'+c.text+'</p></div>').join(""):'<div class="row"><p>None.</p></div>')+'</section>').join("")+'</div>'+
 '<section class="card" style="margin-top:12px"><div class="ptitle"><span>DECISION PACKAGE</span><b>'+s.decisions[0].status+'</b></div><div class="options">'+s.decisions[0].options.map(o=>'<button class="option" data-decision="'+o[0]+'"><strong>'+o[1]+'</strong><p>Human selection is recorded in the ledger. It does not authorize a side effect.</p></button>').join("")+'</div></section>';
}
function renderActions(){
 const s=store.session;if(!s)return head("AUTHORITY","Actions","Exact authorization binds action to human approval.")+empty();
 return head("AUTHORIZATION ≠ DECISION","Actions & authority","Effectful actions require explicit, single-use human authorization.")+
 '<div class="grid2"><section class="card"><div class="ptitle"><span>PROPOSE ACTION</span><b>BOUND</b></div><div class="form"><p class="neutral">This fixture proposes a measurement-design write action. It binds to current PASS claims.</p><button class="btn primary" id="requestAction">Request authorization</button></div></section><section class="card list"><div class="ptitle"><span>AUTHORIZATIONS</span><b>'+s.auth.length+'</b></div>'+ (s.auth.length?s.auth.map(a=>{const act=s.actions.find(x=>x.id===a.actionId);return'<div class="auth"><div><strong>'+act.title+'</strong><span class="'+tone(a.status)+' tag">'+a.status+'</span></div><p>'+act.executor+' · effect '+act.effect+' · '+(a.consumed?"CONSUMED":"UNUSED")+'</p><div class="buttons">'+(a.status==="PENDING"?'<button class="btn" data-deny="'+a.id+'">Deny</button><button class="btn primary" data-approve="'+a.id+'">Approve exact action</button>':a.status==="APPROVED"&&!a.consumed?'<button class="btn primary" data-exec="'+act.id+'">Execute once</button>':'')+'</div></div>'}).join(""):'<div class="row"><p>No authorizations.</p></div>')+'</section></div>';
}
function renderLedger(){
 const s=store.session;if(!s)return head("TRACE","Event ledger","Inspect the process, not just the answer.")+empty();
 return head("APPEND-ONLY TRACE","Event ledger","Every fixture state transition is visible.")+'<section class="card"><div class="ptitle"><span>EVENTS</span><b>'+s.ledger.length+'</b></div>'+s.ledger.slice().reverse().map(e=>'<div class="event"><span>'+String(e.seq).padStart(4,"0")+'</span><b>'+e.type+'</b><em>'+e.actor+'</em><time>'+e.time+'</time></div>').join("")+'</section>';
}
function renderArchitecture(){
 return head("SYSTEM GENEALOGY","Architecture","Execution, assurance and human authority are separate layers.")+'<div class="arch"><aside>'+arch.map((a,i)=>'<button class="'+(i===selectedArch?"active":"")+'" data-arch="'+i+'"><strong>'+a[0]+'</strong><br><small>'+a[1]+'</small></button>').join("")+'</aside><article><span>'+arch[selectedArch][1]+'</span><h2>'+arch[selectedArch][0]+'</h2><p>'+arch[selectedArch][2]+'</p></article></div>';
}
function render(){
 nav();let html="";
 if(view==="overview")html=renderOverview();else if(view==="mission")html=renderMission();else if(view==="evidence")html=renderEvidence();else if(view==="claims")html=renderClaims();else if(view==="decision")html=renderDecision();else if(view==="actions")html=renderActions();else if(view==="ledger")html=renderLedger();else html=renderArchitecture();
 document.getElementById("work").innerHTML=html;bind();
}
function bind(){
 document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{view=x.dataset.go;render()});
 const start=document.getElementById("start");if(start)start.onclick=()=>{view="mission";render()};
 const mf=document.getElementById("missionForm");if(mf)mf.onsubmit=e=>{e.preventDefault();newSession(document.getElementById("goal").value.trim())};
 const ef=document.getElementById("evForm");if(ef)ef.onsubmit=e=>{e.preventDefault();addEvidence({kind:document.getElementById("evKind").value,summary:document.getElementById("evSummary").value.trim(),source:document.getElementById("evSource").value.trim(),uncertainty:document.getElementById("evUncertainty").value.trim()})};
 document.querySelectorAll("[data-claim]").forEach(x=>x.onclick=()=>{selectedClaim=Number(x.dataset.claim);render()});
 const cf=document.getElementById("claimForm");if(cf)cf.onsubmit=e=>{e.preventDefault();const ids=[...document.querySelectorAll("#evChecks input:checked")].map(x=>x.value);addClaim({text:document.getElementById("clText").value.trim(),epistemic:document.getElementById("clClass").value,uncertainty:document.getElementById("clUncertainty").value.trim(),evidence:ids})};
 const rc=document.getElementById("reviewClaim");if(rc)rc.onclick=()=>{const c=store.session.claims[selectedClaim];c.reviewed=true;event("CLAIM_REVIEW_RECORDED",{claimId:c.id});evalClaim(c);store.session.phase="VERIFY";save();render()};
 document.querySelectorAll("[data-decision]").forEach(x=>x.onclick=()=>decision(store.session.decisions[0],x.dataset.decision));
 const ra=document.getElementById("requestAction");if(ra)ra.onclick=requestAction;
 document.querySelectorAll("[data-approve]").forEach(x=>x.onclick=()=>decideAuth(store.session.auth.find(a=>a.id===x.dataset.approve),true));
 document.querySelectorAll("[data-deny]").forEach(x=>x.onclick=()=>decideAuth(store.session.auth.find(a=>a.id===x.dataset.deny),false));
 document.querySelectorAll("[data-exec]").forEach(x=>x.onclick=()=>execute(store.session.actions.find(a=>a.id===x.dataset.exec)));
 document.querySelectorAll("[data-arch]").forEach(x=>x.onclick=()=>{selectedArch=Number(x.dataset.arch);render()});
}
render();
</script>
</body></html>
